<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050A1A" />
    <title>StrikeSync</title>

    <!-- Fonts: Orbitron (title) + Rajdhani (UI text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #050A1A;
      }
      /* Prevent blue highlight flash on click */
      * { -webkit-tap-highlight-color: transparent; outline: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
